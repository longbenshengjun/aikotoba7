<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ナゾリンと あいことばの たび その7 くだもののたび</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
       background: #eef6f0; color: #444; }
.wrap { max-width: 720px; margin: 0 auto; padding: 14px 14px 60px; }
h1 { font-size: 28px; color: #3a8060; text-align: center; margin: 14px 0 4px; }
.sub { text-align: center; color: #999; font-size: 14px; margin-bottom: 12px; }
.card { background: #fff; border: 3px solid #9fd0b0; border-radius: 20px;
        padding: 18px; margin: 12px 0; }
.q { font-size: 24px; line-height: 2.0; font-weight: bold; color: #333; }
.tag { display: inline-block; background: #3a8060; color: #fff; font-size: 16px;
       padding: 4px 16px; border-radius: 99px; margin-bottom: 10px; font-weight: bold; }
.btn { display: block; width: 100%; padding: 22px; font-size: 26px; font-weight: bold;
       border: none; border-radius: 18px; margin: 12px 0; cursor: pointer;
       background: #fff; border: 4px solid #6db3e8; color: #2a6db0; }
.btn:active { transform: scale(0.98); }
.btn-go { background: #3a8060; border-color: #3a8060; color: #fff; }
.btn-easy { border-color: #f0a050; color: #d06a20; font-size: 24px; }
.btn-hard { border-color: #7a50a8; color: #7a50a8; font-size: 24px; }
.btn-done { border-color: #ccc; color: #aaa; }
.btn-cerb { border-color: #b03030; color: #902020; font-size: 22px;
            background: linear-gradient(135deg, #fff4f0, #ffe8e0); }
input.ansbox { width: 100%; padding: 16px; font-size: 26px; border-radius: 14px;
       border: 3px solid #b03030; background: #fff; color: #333; margin: 10px 0;
       font-weight: bold; }
video { width: 100%; border-radius: 14px; background: #000; }
.play { display: flex; align-items: center; justify-content: center; gap: 12px;
        width: 100%; padding: 22px; font-size: 26px; font-weight: bold;
        border-radius: 18px; border: 4px solid #e0a030; background: #fff8e0;
        color: #b07010; cursor: pointer; margin: 12px 0; }
.big-kana { font-size: 120px; font-weight: 900; color: #e05555; text-align: center;
            line-height: 1.3; }
.roomname { font-size: 36px; font-weight: 900; color: #3a8060; text-align: center; margin: 10px 0; }
.overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
           align-items: center; justify-content: center; z-index: 99; }
.ov-ok { background: rgba(255, 252, 240, 0.97); }
.ov-ng { background: rgba(255, 250, 240, 0.97); }
.maru { width: 200px; height: 200px; border: 22px solid #e05555; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; }
.maru-in { width: 110px; height: 110px; border: 14px solid #e05555; border-radius: 50%; }
.batsu { position: relative; width: 180px; height: 180px; }
.batsu div { position: absolute; top: 78px; left: -8px; width: 196px; height: 24px;
             background: #e0a030; border-radius: 12px; }
.batsu div:first-child { transform: rotate(45deg); }
.batsu div:last-child { transform: rotate(-45deg); }
.ov-text { font-size: 42px; font-weight: 900; margin-top: 24px; text-align: center; }
.ok-t { color: #e05555; } .ng-t { color: #d08820; }
.stars { font-size: 40px; letter-spacing: 8px; margin-top: 6px; }
.topnav { font-size: 15px; color: #70a080; margin-bottom: 6px; cursor: pointer; font-weight: bold; }
.kanaline { display: flex; justify-content: center; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
.kbox { width: 76px; height: 76px; border: 4px solid #3a8060; border-radius: 14px;
        display: flex; align-items: center; justify-content: center; font-size: 44px;
        font-weight: 900; color: #333; background: #fff; }
.kbox.empty { border-style: dashed; border-color: #ccc; color: #eee; }
.note { font-size: 15px; color: #999; line-height: 1.8; margin-top: 10px; }
.center { text-align: center; }
.progress { text-align: center; font-size: 16px; color: #70a080; font-weight: bold; margin: 6px 0; }
.hdr { text-align:center; font-size:13px; color:#cfe8d6; padding:4px 0 2px; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
body { background: linear-gradient(180deg,#2e7d4f 0%,#256a43 55%,#1d5636 100%) fixed; }
h1 { color:#ffb347; text-shadow: 0 2px 0 #1d5636; }
.sub { color:#dfe5ff; }
.card { border-color:#f2c94c; }
.tag { background:#2e7d4f; }
.btn-go { background:#2e7d4f; border-color:#2e7d4f; }
.roomname { color:#2e7d4f; }
.progress { color:#2e7d4f; }
.kbox { border-color:#2e7d4f; width:62px; height:62px; font-size:36px; }
.kbox.kstar { border-color:#8e7cf0; background:#f3f0ff; }
.kanaline { gap: 6px; }
.grid10 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid10 .btn.c10 { margin:0; padding:16px 6px; font-size:22px; }
.hint { background:#fff8d6; border:3px dashed #e6a817; color:#8a6200; border-radius:14px; padding:12px; font-size:22px; font-weight:bold; text-align:center; margin:10px 0; }
.teacher { border-color:#2e7d4f; background:#f4f6ff; }
.codebox { border-color:#2e7d4f !important; text-align:center; letter-spacing:8px; }
.lockcount { font-size:96px; font-weight:900; color:#d08820; text-align:center; line-height:1.1; margin-top:10px; }
button:disabled { cursor: default; }
.scanbox { position:relative; width:100%; max-width:480px; margin:10px auto; aspect-ratio:1; overflow:hidden; border-radius:16px; background:#000; }
.scanbox video { width:100%; height:100%; object-fit:cover; border-radius:0; }
.scanframe { position:absolute; inset:15%; border:6px solid #ffb347; border-radius:18px; box-shadow:0 0 0 999px rgba(0,0,0,.25); }
</style>
</head>

      q:'「パイナップル」の「パイン」は、<br>みの 形が ある 木の「まつぼっくり」に<br>にているから つけられた。その 木の なまえを<br>ひらがなで 入力せよ。',
      ans:['まつ','マツ','松'] },
    { input:1, hint:'2もじ',
      q:'「かき」の みが オレンジいろに なって<br>おいしく なる きせつを ひらがなで 入力せよ。',
      ans:['あき','秋'] },
  ],
};

// ===== ほぞん(iPadの Safariに きろく) ==================================
const KEY = 'aikotoba7_state';
let st = null;   // { course, order, bag, p, lockUntil, missed:{} }
function load() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.course) return v; } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function clearState() { st = null; try { localStorage.removeItem(KEY); } catch (e) {} }

// ===== ランダム化 =======================================================
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// もじ5つ + ほしの かけら2つ を まぜる(もじだけ ならべても こたえの じゅんに ならないように)
function scrambledBag() {
  let b;
  do { b = shuffle(KANAS.concat(Array(NUM_STARS).fill(STAR_ITEM))); }
  while (b.filter(x => x !== STAR_ITEM).join('') === ANSWER);
  return b;
}
function scrambledRooms() {
  const base = [...Array(N).keys()];
  let o;
  do { o = shuffle(base); } while (o.join(',') === base.join(','));
  return o;
}

// ===== がめん きょうつう ===============================================
function show(h) {
  stopScan();
  app.innerHTML = `<div id="hdr" class="hdr">${TITLE}</div>` + h;
  window.scrollTo(0, 0);
  setupLongPress();
}
function norm(s) {
  s = (s || '').trim().normalize('NFKC').toLowerCase();
  s = s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  s = s.replace(/[\s\-_.、。・]/g, '');
  return s;
}
function feedback(ok, cb) {
  ovr.style.display = 'block';
  if (ok) {
    ovr.innerHTML = `<div class="overlay ov-ok">
      <div class="maru"><div class="maru-in"></div></div>
      <div class="ov-text ok-t">せいかい!!</div>
      <div class="stars"><span style="color:#e6a817">&#9733;</span><span style="color:#e05555">&#9733;</span><span style="color:#4a90d9">&#9733;</span></div></div>`;
  } else {
    ovr.innerHTML = `<div class="overlay ov-ng">
      <div class="batsu"><div></div><div></div></div>
      <div class="ov-text ng-t">おしい!<br>もう いちど!</div></div>`;
  }
  setTimeout(() => { ovr.style.display = 'none'; ovr.innerHTML = ''; if (cb) cb(); }, 1600);
}
function itemBox(x) {
  if (x === STAR_ITEM) return `<div class="kbox kstar">${pic('FRAGMENT', 50)}</div>`;
  return `<div class="kbox">${x}</div>`;
}
function kanaLine(n, all) {
  let h = '';
  for (let i = 0; i < N; i++) {
    const got = all || i < n;
    h += got ? itemBox(st.bag[i]) : `<div class="kbox empty">?</div>`;
  }
  return `<div class="kanaline">${h}</div>`;
}
function nextPlace() { return st.order[st.p]; }

// ===== まちがえた ときの 20びょう まち ==================================
let lockTimer = null;
function lockRemain() { return st && st.lockUntil ? Math.ceil((st.lockUntil - Date.now()) / 1000) : 0; }
function showLock(after) {
  ovr.style.display = 'block';
  const draw = () => {
    const r = lockRemain();
    if (r <= 0) {
      clearInterval(lockTimer); lockTimer = null;
      ovr.style.display = 'none'; ovr.innerHTML = '';
      st.lockUntil = 0; save();
      if (after) after();
      return;
    }
    ovr.innerHTML = `<div class="overlay ov-ng">
      <div class="batsu"><div></div><div></div></div>
      <div class="ov-text ng-t">ざんねん!</div>
      <div class="q center" style="font-size:22px;margin-top:10px">よく かんがえてから こたえてね。</div>
      <div class="lockcount">${r}</div>
      <div class="q center" style="font-size:20px">びょう まってね</div></div>`;
  };
  if (lockTimer) clearInterval(lockTimer);
  draw();
  lockTimer = setInterval(draw, 250);
}
function penalty(after) {
  st.lockUntil = Date.now() + PENALTY_SEC * 1000;
  save();
  showLock(after);
}

// ===== せんせいの かいじょコード =========================================
function teacherBox(label) {
  return `<div class="card teacher">
      <div class="q center" style="font-size:20px">&#128273; ${label}</div>
      <input type="password" id="tcode" class="ansbox codebox" inputmode="numeric" pattern="[0-9]*"
             maxlength="8" autocomplete="off" placeholder="かいじょコード">
      <button class="btn btn-go" onclick="checkTeacher()">かいじょ する</button>
      <div id="tmsg" class="q center" style="font-size:18px;color:#b03030"></div>
    </div>`;
}
let teacherOK = null;
function checkTeacher() {
  const v = (document.getElementById('tcode').value || '').normalize('NFKC').trim();
  if (!v) return;
  if (v === TEACHER_CODE) { if (teacherOK) teacherOK(); return; }
  document.getElementById('tcode').value = '';
  penalty(() => { const m = document.getElementById('tmsg'); if (m) m.textContent = 'コードが ちがいます'; });
}

// ===== がめん ===========================================================
function home() {
  show(`
    <h1>ナゾリンと<br>あいことばの たび</h1>
    <div class="sub">&#127827; くだものの たび・その7 &#127815;</div>
    <video src="${MEDIA.OPENING}" controls playsinline></video>
    <div class="card">
      <div class="q" style="font-size:20px">コースを えらんでね。<br>
      <span style="font-size:16px;color:#888">ばしょに ついたら、この がめんの 「QRコードを よみとる」ボタンで よみとってね。</span></div>
    </div>
    <button class="btn btn-easy" onclick="setCourse('easy')">&#9734; にこにこコース(ていがくねん)</button>
    <button class="btn btn-hard" onclick="setCourse('hard')">&#9733; きらきらコース(こうがくねん)</button>
    <button class="btn btn-cerb" onclick="setCourse('cerberus')">&#128293; シャイニングケルベロスコース(ちょう むずかしい)</button>`);
}

function setCourse(c) {
  st = { course: c, order: scrambledRooms(), bag: scrambledBag(), p: 0, lockUntil: 0, missed: {} };
  save();
  roomMenu();
}

function roomMenu(msg) {
  clearUrl();
  if (st.p >= N) { finalScreen(); return; }
  const i = nextPlace();
  show(`
    <div class="sub" style="margin-top:6px">${COURSE_LABEL[st.course]}</div>
    ${msg || ''}
    <div class="card">
      <div class="q center" style="font-size:20px">あつめた アイテム</div>
      ${kanaLine(st.p)}
      <div class="progress">${st.p} / ${N} の ばしょ クリア!</div>
    </div>
    <div class="card">
      <div class="q center" style="font-size:20px">つぎの ばしょは……</div>
      <div class="roomname">${ROOMS[i]}</div>
      <div class="q center" style="font-size:18px; color:#888">(${ITEMS[i]})</div>
    </div>
    <div class="q center" style="font-size:18px;color:#ffe9a8;margin-top:14px">ついたら、そこに はってある QRコードを よみとってね!</div>
    <button class="btn btn-go" style="font-size:28px" onclick="startScan()">&#128247; QRコードを よみとる</button>`);
}

function wrongPlace(idx) {
  const cleared = st.order.slice(0, st.p).includes(idx);
  const txt = cleared ? `「${ROOMS[idx]}」は もう クリアしたよ!` : `ここは「${ROOMS[idx]}」。<br>ここじゃないよ!`;
  roomMenu(`<div class="card" style="border-color:#e0a030;background:#fff8e0">
      <div class="q center" style="font-size:22px;color:#b07010">${txt}</div></div>`);
}

function hintHTML(qd) {
  const m = /^(\d+)もじ$/.exec(qd.hint || '');
  const body = m ? '○'.repeat(+m[1]) + ` (${m[1]}もじ)` : qd.hint;
  return `<div class="hint">&#128161; ヒント: こたえは ${body}</div>`;
}

function roomQ() {
  const idx = nextPlace();
  const qd = QUESTIONS[st.course][idx];
  let media = '';
  if (qd.media === 'AUDIO_MUSIC') media = `<div class="center">${pic('COVER', 220)}</div>`;
  if (qd.media && qd.media.indexOf('AUDIO') === 0) media += `
    <button class="play" onclick="document.getElementById('au').play()">&#9835; おとを きく</button>
    <audio id="au" src="${MEDIA[qd.media]}"></audio>`;
  if (qd.media === 'VIDEO_TV') media = `<video src="${MEDIA.VIDEO_TV}" controls playsinline></video>`;
  if (qd.mission) media = `<div class="center" style="margin:6px 0 10px">${pic(qd.img, 200)}</div>`;
  let body = '';
  if (qd.mission) {
    body = `<div class="q center" style="font-size:20px;color:#ffe9a8">できたら せんせいを よんでね!</div>` +
           teacherBox('せんせいが かいじょコードを いれてね');
    teacherOK = () => feedback(true, clearRoom);
  } else if (qd.input) {
    body = (st.missed && st.missed[idx] ? hintHTML(qd) : '') +
      `<input type="text" id="tin" class="ansbox" placeholder="こたえを 入力"
            autocomplete="off" autocapitalize="off">
            <button class="btn btn-go" onclick="ansInput()">かいとうする!</button>`;
  } else {
    // 10この せんたくしを まいかい ならべかえて 2れつで ひょうじ
    const order = shuffle([...qd.c.keys()]);
    body = `<div class="grid10">` + order.map(i => `<button class="btn c10" onclick="ans(${i})">${qd.c[i]}</button>`).join('') + `</div>`;
  }
  show(`
    <div class="card">
      <span class="tag">${ROOMS[idx]} の もんだい</span>
      ${media}
      <div class="q">${qd.q}</div>
    </div>
    ${body}`);
  if (lockRemain() > 0) showLock();
}

function clearRoom() {
  const p = st.p;
  st.p = p + 1;
  save();
  itemGet(p);
}
function ansInput() {
  const idx = nextPlace();
  const qd = QUESTIONS[st.course][idx];
  const raw = norm(document.getElementById('tin').value);
  if (!raw) return;
  const v2 = /^\d+(こ|個|しゅう|周|つ)$/.test(raw) ? raw.replace(/\D+$/, '') : raw;
  if (qd.ans.map(norm).includes(raw) || qd.ans.map(norm).includes(v2)) { feedback(true, clearRoom); return; }
  const first = !(st.missed && st.missed[idx]);
  st.missed = st.missed || {}; st.missed[idx] = true; save();
  feedback(false, () => { if (first) roomQ(); });   // 1かい まちがえたら もじすうの ヒントを だす
}
function ans(i) {
  const qd = QUESTIONS[st.course][nextPlace()];
  if (i === qd.a) feedback(true, clearRoom);
  else penalty(() => roomQ());   // 20びょう まって、せんたくしを ならべかえて もういちど
}

function itemGet(p) {
  const x = st.bag[p];
  const inner = x === STAR_ITEM
    ? `<div class="q center">ほしの かけらを ゲット!</div>
       <div class="center" style="margin:10px 0">${pic('FRAGMENT', 180)}</div>
       <div class="q center" style="font-size:20px">ふしぎに ひかる かけらだ……</div>`
    : `<div class="q center">もじを ゲット!</div>
       <div class="big-kana">${x}</div>`;
  show(`
    <div class="card" style="border-color:#e6a817; margin-top:30px">
      ${inner}
      <div class="q center" style="font-size:20px">せんせいから「カード」を もらってね。</div>
    </div>
    <button class="btn btn-go" onclick="roomMenu()">つぎへ すすむ!</button>`);
}

function finalScreen() {
  teacherOK = () => treasure();
  show(`
    <div class="card" style="border-color:#e6a817">
      <div class="q center" style="font-size:22px">${N}この アイテムが そろった!<br>ならべかえて あいことばを かんがえよう!</div>
      ${kanaLine(N, true)}
      <div class="q center" style="font-size:22px; color:#e8590c; margin-top:10px">あいことばが わかったら、<br>せんせいに こっそり つたえてね!</div>
    </div>
    ${teacherBox('あいことばが あっていたら、せんせいが コードを いれてね')}`);
  if (lockRemain() > 0) showLock();
}

function treasure() {
  clearState();   // おわったら じどうで リセット
  show(`
    <video src="${MEDIA.ENDING}" playsinline autoplay muted controls></video>
    <div class="card" style="border-color:#e6a817; margin-top:14px">
      <div class="q center" style="font-size:30px; color:#e8590c">&#11088; だいせいこう! &#11088;</div>
      <div class="q center" style="font-size:20px">あいことばを みごと あてたね!<br>
      ナゾリンから みんなに おたからの プレゼント!</div>
    </div>`);
}

// ===== はじめに: URLの ?at= を みて がめんを きめる =====================
function route() {
  st = load();
  const at = new URLSearchParams(location.search).get('at');
  const idx = at ? CODES.indexOf(at) : -1;
  if (!st) {
    home();
    if (idx >= 0) {
      const c = document.querySelector('.card');
      if (c) c.insertAdjacentHTML('beforebegin', `<div class="card" style="border-color:#e0a030;background:#fff8e0">
        <div class="q center" style="font-size:20px;color:#b07010">まだ コースが えらばれていないよ。<br>さきに コースを えらんでね。</div></div>`);
    }
    clearUrl();
    return;
  }
  if (st.p >= N) { finalScreen(); return; }
  if (idx < 0) { roomMenu(); return; }
  clearUrl(); handlePlace(idx);
}

// ===== せんせい用リセット(うえの タイトルを 3びょう ながおし) ==========
function setupLongPress() {
  const h = document.getElementById('hdr');
  if (!h) return;
  let t = null;
  const start = e => { t = setTimeout(resetScreen, 3000); };
  const stop = () => { clearTimeout(t); };
  h.addEventListener('touchstart', start, { passive: true });
  h.addEventListener('mousedown', start);
  ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => h.addEventListener(ev, stop));
}
function resetScreen() {
  show(`
    <div class="card" style="border-color:#b03030">
      <div class="q center" style="font-size:22px">せんせい用<br>さいしょから やりなおしますか?</div>
      <div class="note center">あつめた もじと すすみぐあいが きえます。</div>
    </div>
    <button class="btn" style="border-color:#b03030;color:#b03030" onclick="clearState(); goHome();">リセットする</button>
    <button class="btn" onclick="route()">やめる</button>`);
}

// ===== がめん ===========================================================
function goHome() { clearUrl(); home(); }
function clearUrl() { try { history.replaceState(null, '', location.pathname); } catch (e) {} }

// ===== ゲームの なかの QRコードリーダー ==================================
let scanStream = null, scanTimer = null;
function stopScan() {
  if (scanTimer) { cancelAnimationFrame(scanTimer); scanTimer = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}
function codeFromText(t) {
  const m = /[?&]at=([a-z0-9]+)/i.exec(t || '');
  return m ? CODES.indexOf(m[1]) : -1;
}
function handlePlace(idx) {
  if (idx === nextPlace()) roomQ(); else wrongPlace(idx);
}
async function startScan() {
  show(`
    <div class="card" style="padding:12px">
      <div class="q center" style="font-size:20px">QRコードを わくの なかに うつしてね</div>
      <div class="scanbox"><video id="scanv" playsinline muted autoplay></video><div class="scanframe"></div></div>
      <div id="scanmsg" class="q center" style="font-size:18px;color:#888">カメラを じゅんびちゅう…</div>
    </div>
    <button class="btn" onclick="roomMenu()">やめる</button>`);
  const v = document.getElementById('scanv');
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) {
    const m = document.getElementById('scanmsg');
    if (m) m.innerHTML = '<span style="color:#b03030">カメラが つかえません。<br>せんせいを よんでね。</span>' +
      '<div class="note">(せんせいへ: iPadの「せってい」→「Safari」→「カメラ」を「許可」にしてください)</div>';
    return;
  }
  if (!document.getElementById('scanv')) { stopScan(); return; }
  v.srcObject = scanStream;
  try { await v.play(); } catch (e) {}
  const msg = document.getElementById('scanmsg'); if (msg) msg.textContent = 'よみとりちゅう…';
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  let lastBad = 0;
  const tick = () => {
    if (!scanStream) return;
    if (v.readyState >= 2 && v.videoWidth) {
      const sc = Math.min(1, 640 / v.videoWidth);
      cv.width = Math.round(v.videoWidth * sc); cv.height = Math.round(v.videoHeight * sc);
      cx.drawImage(v, 0, 0, cv.width, cv.height);
      const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'dontInvert' });
      if (r && r.data) {
        const idx = codeFromText(r.data);
        if (idx >= 0) { stopScan(); handlePlace(idx); return; }
        const now = Date.now();
        if (now - lastBad > 1500) { lastBad = now; const m = document.getElementById('scanmsg'); if (m) m.innerHTML = '<span style="color:#b07010">この QRコードは ゲームの ものじゃないよ</span>'; }
      }
    }
    scanTimer = requestAnimationFrame(tick);
  };
  scanTimer = requestAnimationFrame(tick);
}


route();
</script>
